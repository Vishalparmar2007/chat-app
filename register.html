<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nook — Create your account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1>Nook</h1>
      </div>

      <h2>Create your account</h2>
      <p class="subtitle">Pick a username, set a password, and you're in.</p>

      <div id="form-error" class="form-error"></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username" placeholder="e.g. sara_writes">
          <div class="hint">3–20 characters: letters, numbers, underscores.</div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="new-password">
          <div class="hint">At least 6 characters.</div>
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="index.html">Log in</a></p>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/register.js"></script>
</body>
</html>

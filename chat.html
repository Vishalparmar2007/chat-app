<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nook — Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-screen">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="waveform">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <h1>Nook</h1>
      </div>

      <form class="new-chat-form" id="new-chat-form">
        <input type="text" id="new-chat-input" placeholder="Message a username...">
        <button type="submit">Start</button>
      </form>
      <div class="new-chat-error" id="new-chat-error"></div>

      <div class="conversation-list" id="conversation-list">
        <div class="empty-state small">No conversations yet</div>
      </div>

      <div class="sidebar-footer">
        <div class="avatar" id="current-avatar">?</div>
        <div class="who">
          <div class="username" id="current-username">Loading...</div>
          <button class="logout" id="logout-btn">Log out</button>
        </div>
      </div>
    </aside>

    <main class="chat-main">
      <div class="chat-header" id="chat-header-title">Select a conversation</div>

      <div class="message-list" id="message-list">
        <div class="empty-state">Pick someone from the left, or start a new conversation above.</div>
      </div>

      <form class="composer" id="composer-form">
        <textarea id="text-input" rows="1" placeholder="Type a message..." disabled></textarea>
        <button type="submit" class="send-btn" id="send-btn" title="Send" disabled>➤</button>
      </form>
    </main>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
